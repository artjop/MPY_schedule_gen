<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        input[type="text"]::placeholder {
            color: #aaa;
        }
        .btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .example-groups {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .example-groups h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: #f0f0f0;
            color: #555;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tag:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Расписание групп</h1>
        <p class="subtitle">Получите ссылку для подписки на календарь вашей группы</p>
        
        <form id="groupForm" onsubmit="redirectToGroup(event)">
            <div class="form-group">
                <label for="groupInput">Введите название группы</label>
                <input 
                    type="text" 
                    id="groupInput" 
                    placeholder="Например: 242-621"
                    required
                    autocomplete="off"
                >
            </div>
            <button type="submit" class="btn">Продолжить</button>
        </form>
        
        <div class="example-groups">
            <h3>Популярные группы:</h3>
            <div class="example-tags">
                <span class="tag" onclick="selectGroup('242-621')">242-621</span>
                <span class="tag" onclick="selectGroup('242-521')">242-521</span>
                <span class="tag" onclick="selectGroup('242-421')">242-421</span>
                <span class="tag" onclick="selectGroup('242-321')">242-321</span>
            </div>
        </div>
    </div>
    
    <script>
        function selectGroup(groupSlug) {
            document.getElementById('groupInput').value = groupSlug;
            redirectToGroup();
        }
        
        function redirectToGroup(event) {
            if (event) event.preventDefault();
            const groupSlug = document.getElementById('groupInput').value.trim();
            if (groupSlug) {
                window.location.href = '/group/' + encodeURIComponent(groupSlug);
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('groupInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                redirectToGroup();
            }
        });
    </script>
</body>
</html>
